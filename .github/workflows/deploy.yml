name: CI / Deploy

# What this does:
#   • Every push & PR to staging  -> run the quality gates (typecheck, depcheck, tests).
#   • Every push to staging (gates green) -> deploy the admin SPA to the
#     `vointika-admin-staging` Cloudflare Pages project.
#
# The `staging` branch is the staging environment: merge work into it to ship to staging.
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   • CLOUDFLARE_API_TOKEN  - a token with the "Cloudflare Pages: Edit" permission.
#   • CLOUDFLARE_ACCOUNT_ID - your Cloudflare account ID (Workers & Pages -> right sidebar).
# No app secrets are needed: VITE_* values are public and baked in from .env.staging.

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

# A newer push to the same branch cancels the in-flight run (don't deploy stale commits).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck · depcheck · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # paraglide/ is generated (not committed) — compile it so the i18n imports
      # (`#/paraglide/messages`) resolve for tsc, depcheck and vitest.
      - run: pnpm paraglide:compile

      - run: pnpm typecheck
      - run: pnpm depcheck
      - run: pnpm test

  deploy-staging:
    name: Deploy → staging
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds dist/client (mode=staging bakes in .env.staging) and uploads it.
      - run: pnpm build:staging

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # For this to serve the live staging site (the .pages.dev root + custom
          # domain) rather than a Preview URL, the Pages project's Production branch
          # must be `staging` (Pages project → Settings → Builds & deployments).
          command: pages deploy dist/client --project-name=vointika-admin-staging --branch=staging

  # ── Production (disabled until the prod Pages project exists) ────────────────
  # When `vointika-admin` is created in Cloudflare, enable this. It deploys only
  # when you push a version tag (e.g. `git tag v1.2.0 && git push --tags`), so a
  # normal push to master can never ship to production.
  #
  # Add `on.push.tags: ['v*']` to the triggers above, then:
  #
  # deploy-production:
  #   name: Deploy → production
  #   needs: verify
  #   if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: pnpm/action-setup@v6
  #     - uses: actions/setup-node@v5
  #       with:
  #         node-version: 22
  #         cache: pnpm
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm build:production
  #     - uses: cloudflare/wrangler-action@v4
  #       with:
  #         apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  #         accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  #         command: pages deploy dist/client --project-name=vointika-admin --branch=main
